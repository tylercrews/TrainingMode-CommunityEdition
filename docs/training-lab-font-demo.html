<script>
(() => {
  const root = document.getElementById('training-lab-font-demo');
  const data = JSON.parse(document.getElementById('lab-font-data').textContent);
  const sample = document.getElementById('lab-font-sample');
  const size = document.getElementById('lab-font-size');
  const narrow = document.getElementById('lab-font-narrow');
  const stockCanvas = document.getElementById('lab-font-stock');
  const debugCanvas = document.getElementById('lab-font-debug');
  const atlas = new Image();
  const state = { text: sample.value, size: 28, narrow: false };
  const saved = window.openai?.widgetState?.modelContent;
  function restore(saved) {
    if (typeof saved?.sample === 'string') state.text = saved.sample.slice(0, 180);
    if (Number.isFinite(saved?.cellHeight)) state.size = Math.max(18, Math.min(40, saved.cellHeight));
    if (typeof saved?.narrow === 'boolean') state.narrow = saved.narrow;

  }
  function save() {
    window.openai?.setWidgetState?.({ modelContent: { sample: state.text, cellHeight: state.size, narrow: state.narrow }, privateContent: null }).catch(() => {});

  function draw(canvas, family, tinted) {
    const width = Math.max(220, Math.floor(canvas.getBoundingClientRect().width));

    const placements = [];

    for (const raw of state.text.replace(/[^\x20-\x7e\n]/g, '?')) {
